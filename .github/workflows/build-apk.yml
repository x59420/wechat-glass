name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.1'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android build packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build signed APK
        env:
          WXGLASS_KEYSTORE_PASSWORD: ${{ secrets.WXGLASS_KEYSTORE_PASSWORD }}
        run: bash build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wxglass-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: wxglass-apk
          path: artifact

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$(find artifact -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          VER="$(basename "$APK" .apk | sed 's/^wxglass-//')"
          TAG="v${VER}-build.${GITHUB_RUN_NUMBER}"
          PRE=""
          case "$VER" in *test*|*beta*|*TEST*|*BETA*) PRE="--prerelease" ;; esac
          gh release create "$TAG" "$APK" $PRE \
            --title "wxglass ${VER} (build ${GITHUB_RUN_NUMBER})${PRE:+ · 测试版}" \
            --notes "自动构建发布。源码提交：${GITHUB_SHA}${PRE:+；这是测试版，不保证稳定。}"
